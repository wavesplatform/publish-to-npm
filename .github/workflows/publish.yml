name: Publish NPM package
on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      test:
        type: boolean
      version:
        required: false
        type: string
      npm_tag:
        required: false
        type: string
        default: latest
      working_directory:
        required: false
        type: string
        default: .

permissions:
  contents: read
  id-token: write
jobs:
  publish-package:
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.publish.outputs.url }}
    name: Publish package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: '>=24.7.0' # Trusted publishing requires npm CLI version 11.5.1 or later.
          package-manager-cache: false # A poisoned cache could reach the OIDC token.
      # npm ci installs exactly the committed lockfile; repos without one fall back to npm i.
      - run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm i
          fi
      - if: ${{ inputs.event_name == 'push' }}
        run: |
          PACKAGE_NAME=$(jq --raw-output .name package.json)
          PREFIX=$(jq --raw-output .version package.json)-snapshot
          NEXT=$(npm view $PACKAGE_NAME versions --json \
            | jq --raw-output --arg prefix $PREFIX '[.[] | select(startswith($prefix))|capture("snapshot\\.(?<n>[0-9]+)").n|tonumber]|max + 1 // 0')
          npm version $PREFIX.$NEXT --no-git-tag-version
          echo "TAG=snapshot" >> $GITHUB_ENV
      - if: ${{ inputs.event_name == 'release' }}
        run: |
          npm version $(echo ${{ inputs.version }} | sed 's/^v//') --no-git-tag-version --allow-same-version
          echo "TAG=${{ inputs.npm_tag }}" >> $GITHUB_ENV
      - run: npm test
        if: ${{ inputs.test }}
      - id: publish
        run: |
          npm publish --provenance --access public --tag $TAG
          echo "url=https://www.npmjs.com/package/$(jq --raw-output .name package.json)/v/$(jq --raw-output .version package.json)" >> "$GITHUB_OUTPUT"
